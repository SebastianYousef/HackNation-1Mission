# Rare Disease Atlas — local production-like stack.
#
#   client ──► l4 (HAProxy, TCP, :80/:443) ──PROXY v2──► l7 ×2 (HAProxy, HTTP/TLS)
#                 ├─ /api/*  ──► api ×N (FastAPI, stateless) ──► db (Postgres) + redis
#                 └─ else    ──► web ×2 (nginx, built SPA)       worker ◄── redis queue
#
#   ./scripts/gen-dev-cert.sh            # once: TLS cert for the L7 tier
#   docker compose up -d --build         # (from infra/)  or `make up` at the repo root
#   docker compose up -d --scale api=5   # horizontal scaling (`make scale N=5`)
#
# Secrets/overrides come from ../backend/.env (optional). Set DATABASE_URL there
# to use an external Postgres instead of the local `db` service (then the db
# container is idle).
# The ${VAR:-default} values below are interpolated by compose, which reads only the
# shell and --env-file: `make up` passes --env-file ../backend/.env for you; plain
# `docker compose` from infra/ needs `--env-file ../backend/.env` too, or those
# keys silently fall back to the defaults. (A localhost DATABASE_URL won't work
# from inside a container.)
name: atlas

x-api-env: &api-env
  DATA_MODE: ${DATA_MODE:-fixtures}
  DB_ENDPOINTS: ${DB_ENDPOINTS:-}
  DATABASE_URL: ${DATABASE_URL:-postgresql://atlas:atlas@db:5432/atlas}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: ${CORS_ORIGINS:-https://*.lovable.app,https://*.lovableproject.com}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Client IP = X-Forwarded-For entry this many hops from the right. The L7 replaces that
  # header with exactly one entry (the PROXY-protocol source), so this stack needs 1.
  # Fixed on purpose: a TRUSTED_PROXY_HOPS=0 in backend/.env (right for a bare `make
  # api-dev`) must not leak in here, or every client would share the L7's rate-limit bucket.
  TRUSTED_PROXY_HOPS: "1"
  # INSTANCE_ID defaults to the container hostname -> distinct per replica (X-Served-By)

services:
  l4:
    image: haproxy:3.2-alpine
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./haproxy/l4.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on: [l7]
    restart: unless-stopped

  l7:
    image: haproxy:3.2-alpine
    deploy:
      replicas: 2
    expose: ["8080", "8443", "8081", "8404"]
    volumes:
      - ./haproxy/l7.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./certs:/usr/local/etc/haproxy/certs:ro
    depends_on: [api, web]
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    image: atlas-api:dev
    deploy:
      replicas: 3
    expose: ["8000"]
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      <<: *api-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      SHUTDOWN_GRACE_SECONDS: "5"
    stop_grace_period: 30s     # > SHUTDOWN_GRACE_SECONDS + uvicorn graceful timeout
    depends_on:
      redis: { condition: service_started }
      db: { condition: service_healthy }
    restart: unless-stopped

  worker:
    image: atlas-api:dev
    command: ["python", "-m", "atlas_api.worker"]
    env_file:
      - path: ../backend/.env
        required: false
    environment: *api-env
    healthcheck:
      disable: true            # the image's HTTP /healthz check doesn't apply (no server here)
    # SIGTERM stops new jobs; a running gap search gets time to finish instead
    # of being SIGKILLed and left 'running' in Redis.
    stop_grace_period: 60s
    depends_on: [api, redis]
    restart: unless-stopped

  web:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    deploy:
      replicas: 2
    expose: ["8080"]
    volumes:
      # The built frontend: `npm run build` in the Lovable repo, copy dist/ to ../frontend-dist
      # (or set WEB_DIST=/abs/path/to/dist). Unknown paths fall back to index.html (SPA routing).
      - ${WEB_DIST:-../frontend-dist}:/usr/share/nginx/html:ro
      - ./nginx/web.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Ephemeral by design (cache, rate-limit counters, job status). Every key except
    # the job queue has a TTL, so volatile-lru never evicts queued jobs.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb",
              "--maxmemory-policy", "volatile-lru"]
    restart: unless-stopped

  # Bundled Postgres (pgvector/pg16). No deployment uses Supabase; point DATABASE_URL
  # at another Postgres 16+ (pg_trgm + pgvector) to bypass this service.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    volumes:
      - ../backend/db/migrations:/docker-entrypoint-initdb.d:ro   # run once, in file-name order
      - pgdata:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]   # for `make db-migrate` / the pipeline loader
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
