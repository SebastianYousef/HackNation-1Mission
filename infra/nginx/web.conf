# Static SPA (the built frontend `dist/`). Image: nginxinc/nginx-unprivileged (listens on 8080, non-root).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets: cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Served-By $hostname;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths (client-side routes like /disease/MONDO:1) -> index.html.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Served-By $hostname;
        try_files $uri $uri/ /index.html;
    }
}
