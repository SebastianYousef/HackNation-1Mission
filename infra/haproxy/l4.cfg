# =============================================================================
# L4 load balancer (transport layer). Sees only TCP: the 5-tuple
# (src ip, src port, dst ip, dst port, proto). It never decrypts TLS
# ("passthrough") and never parses HTTP. Its job: spread TCP connections over
# the L7 balancers and keep the real client IP alive via PROXY protocol v2.
# =============================================================================
global
    log stdout format raw local0
    maxconn 20000

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 5s
    timeout client  65s
    timeout server  65s

# Docker's embedded DNS: "l7" resolves to every replica of the l7 service.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 5s
    hold obsolete 10s

# Container-internal ports 8080/8443 (published as 80/443) so HAProxy can run
# as its non-root default user.
frontend fe_http
    bind :8080
    default_backend be_l7_http

frontend fe_https
    bind :8443
    default_backend be_l7_https

# Edge entry: a tunnel that already terminated public TLS (Tailscale Funnel or
# cloudflared on the host) connects here over plain TCP. Published on 127.0.0.1
# only (see deploy/gpu-server), so nothing else can reach it.
frontend fe_edge
    bind :8081
    default_backend be_l7_edge

# balance source + consistent hashing: the same client IP always lands on the
# same L7 node (stable TLS session reuse and per-client rate limits), and
# adding/removing an L7 node only remaps ~1/N of clients.
# send-proxy-v2: prepend a binary PROXY header carrying the original client
# ip:port, because after this hop the TCP source address is the L4's own IP.
# Health checks go to the L7 monitor port (8404, plain HTTP, no PROXY header).
backend be_l7_http
    balance source
    hash-type consistent
    option httpchk GET /healthz
    default-server check port 8404 inter 2s fall 2 rise 2 send-proxy-v2 resolvers docker init-addr none
    server-template l7- 4 l7:8080

backend be_l7_https
    balance source
    hash-type consistent
    option httpchk GET /healthz
    default-server check port 8404 inter 2s fall 2 rise 2 send-proxy-v2 resolvers docker init-addr none
    server-template l7- 4 l7:8443

backend be_l7_edge
    balance source
    hash-type consistent
    option httpchk GET /healthz
    default-server check port 8404 inter 2s fall 2 rise 2 send-proxy-v2 resolvers docker init-addr none
    server-template l7- 4 l7:8081
