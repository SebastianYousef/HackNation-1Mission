# =============================================================================
# L7 load balancer (application layer, HTTP). Terminates TLS, reads the PROXY
# header from L4 to learn the real client IP, routes by path, adds tracing
# headers, rate-limits per client and health-checks API replicas on /readyz.
# Run 2+ of these behind the L4 so the L7 tier is not a single point of failure.
# =============================================================================
global
    log stdout format raw local0
    maxconn 20000
    ssl-default-bind-options ssl-min-ver TLSv1.2
    tune.ssl.default-dh-param 2048

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor              # X-Forwarded-For = client IP (taken from the PROXY header)
    option redispatch              # retry another server if the chosen one is down
    retries 2
    timeout connect 5s
    timeout client  30s
    timeout server  30s            # AI endpoints can take ~15 s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout queue 10s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 5s                  # new `--scale api=N` replicas show up within ~5 s
    hold obsolete 10s
    accepted_payload_size 8192

# Health endpoint for the L4 + live stats page (http://<l7>:8404/stats)
frontend fe_monitor
    bind :8404
    monitor-uri /healthz
    stats enable
    stats uri /stats
    stats refresh 5s

# Port 80 (via L4): redirect everything to HTTPS.
frontend fe_http
    bind :8080 accept-proxy
    http-request redirect scheme https code 301

frontend fe_https
    bind :8443 accept-proxy ssl crt /usr/local/etc/haproxy/certs/dev.pem alpn h2,http/1.1
    # Trusted edge (via L4 fe_edge): TLS was terminated by Tailscale Funnel /
    # cloudflared, so plain HTTP here is still https for the client.
    bind :8081 accept-proxy

    # --- tracing headers ---------------------------------------------------
    unique-id-format %[uuid()]
    http-request set-header X-Request-Id %[unique-id] unless { req.hdr(x-request-id) -m found }
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port %[dst_port]
    http-response set-header X-LB-L7 %[hostname]
    http-response set-header Strict-Transport-Security "max-age=300"

    # --- rate limiting (per client IP, real IP thanks to PROXY protocol) -----
    # The L4 balances on source IP, so each client always hits the same L7 and
    # this per-node table is effectively a global per-client limit.
    stick-table type ipv6 size 200k expire 60s store http_req_rate(10s)
    # Behind a tunnel every connection comes from 127.0.0.1; trust the edge's
    # X-Forwarded-For (last hop) on the edge port only, so limits stay per client.
    http-request set-src hdr_ip(x-forwarded-for,-1) if { dst_port 8081 } { req.hdr(x-forwarded-for) -m found }
    http-request track-sc0 src
    http-request deny deny_status 429 hdr Retry-After 10 content-type application/json lf-string '{"error":{"code":"rate_limited","message":"too many requests (load balancer limit)","request_id":"%[req.hdr(x-request-id)]"}}' if { sc_http_req_rate(0) gt 200 }

    # --- routing -------------------------------------------------------------
    acl is_api      path_beg /api/
    acl is_ops      path /healthz /readyz
    # acl is_explain path /api/v1/explain
    http-request return status 404 content-type application/json lf-string '{"error":{"code":"not_found","message":"route not found","request_id":"%[req.hdr(x-request-id)]"}}' if is_ops  # replica probes stay internal
    # use_backend be_api_explain if is_explain      # optional, see below
    use_backend be_api if is_api
    default_backend be_web

# Stateless API replicas. Any replica can serve any request (state is in
# Postgres/Redis), so plain round robin + health checks is enough.
backend be_api
    balance roundrobin
    option httpchk
    http-check send meth GET uri /readyz ver HTTP/1.1 hdr Host api
    http-check expect status 200
    # /readyz flips to 503 on SIGTERM -> marked DOWN after 2 checks (~4 s), new
    # requests stop, in-flight ones finish (uvicorn graceful shutdown).
    default-server inter 2s fall 2 rise 2 slowstart 10s resolvers docker init-addr none
    # --- sticky sessions: OFF on purpose (stateless API). To turn on, uncomment:
    # dynamic-cookie-key atlas-demo
    # cookie SERVERID insert indirect nocache httponly secure dynamic
    server-template api- 20 api:8000 check

# Optional: consistent hash on the URI for POST /api/v1/explain so identical
# requests hit the same replica (warm in-process state). We don't need it today
# because the explanation cache is in Postgres and shared by every replica.
# backend be_api_explain
#     balance uri whole
#     hash-type consistent
#     option httpchk
#     http-check send meth GET uri /readyz ver HTTP/1.1 hdr Host api
#     http-check expect status 200
#     default-server inter 2s fall 2 rise 2 resolvers docker init-addr none
#     server-template api- 20 api:8000 check

# Static SPA (built frontend) served by nginx.
backend be_web
    balance roundrobin
    option httpchk GET /nginx-health
    default-server inter 3s fall 2 rise 2 resolvers docker init-addr none
    server-template web- 4 web:8080 check
