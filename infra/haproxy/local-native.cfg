# Native (no containers) demo LB: one HAProxy on :8088 -> 3 uvicorn replicas on
# 127.0.0.1:8001-8003. Used by `make lb-native` on machines without Docker.
global
    log stdout format raw local0
    maxconn 2000

defaults
    mode http
    log global
    option httplog
    option redispatch
    retries 2
    timeout connect 2s
    timeout client  30s
    timeout server  30s
    # LB-generated errors use the contract's ApiError body (same as l7.cfg).
    http-error status 502 content-type application/json hdr X-Request-Id "%[var(txn.rid)]" lf-string '{"error":{"code":"upstream_unavailable","message":"bad gateway (load balancer)","request_id":"%[var(txn.rid),json(utf8s)]"}}'
    http-error status 503 content-type application/json hdr X-Request-Id "%[var(txn.rid)]" lf-string '{"error":{"code":"upstream_unavailable","message":"no server available (load balancer)","request_id":"%[var(txn.rid),json(utf8s)]"}}'
    http-error status 504 content-type application/json hdr X-Request-Id "%[var(txn.rid)]" lf-string '{"error":{"code":"upstream_unavailable","message":"upstream timed out (load balancer)","request_id":"%[var(txn.rid),json(utf8s)]"}}'

frontend fe_monitor
    bind 127.0.0.1:8405
    stats enable
    stats uri /stats
    stats refresh 2s

frontend fe_api
    bind 127.0.0.1:8088
    unique-id-format %[uuid()]
    http-request set-header X-Request-Id %[unique-id] unless { req.hdr(x-request-id) -m found }
    http-request set-var(txn.rid) req.hdr(x-request-id)   # kept for http-error bodies (req headers are gone by then)
    # Drop any client-supplied X-Forwarded-For; the API gets exactly one trusted entry.
    http-request set-header X-Forwarded-For %[src]
    stick-table type ipv6 size 10k expire 60s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 hdr Retry-After 10 content-type application/json lf-string '{"error":{"code":"rate_limited","message":"too many requests (load balancer limit)","request_id":"%[req.hdr(x-request-id),json(utf8s)]"}}' if { sc_http_req_rate(0) gt 200 }
    default_backend be_api

backend be_api
    balance roundrobin
    option httpchk
    http-check send meth GET uri /readyz ver HTTP/1.1 hdr Host api
    http-check expect status 200
    default-server inter 1s fall 2 rise 2
    server api-1 127.0.0.1:8001 check
    server api-2 127.0.0.1:8002 check
    server api-3 127.0.0.1:8003 check
