mechanisms:
  - id: ATLAS:mech-soluble-lysosomal-protein-deficiency
    label: Soluble lysosomal protein/enzyme deficiency
    subtype: biological_process
    description: NCL forms in which the defect lies in a soluble lysosomal enzyme or protein (CLN1/PPT1, CLN2/TPP1, CLN5, CLN10/cathepsin D, CLN13/cathepsin F), as opposed to a transmembrane protein.
    genes:
    - gene: HGNC:9325   # PPT1
      evidence:
      - quote: CLN1 encodes a soluble lysosomal enzyme, palmitoyl protein thioesterase 1 (PPT1), and it is still unclear why neurons are selectively vulnerable to the loss of PPT1 enzyme activity in infantile CLN1 disease.
        source_type: publication
        source_name: PubMed abstract (Metab Brain Dis 2017)
        source_ref: PMID:27722792
        url: https://pubmed.ncbi.nlm.nih.gov/27722792/
        published_at: '2016-10-08'
        retrieved_at: '2026-10-03'
        method: research:verified-quote
    - gene: HGNC:2073   # TPP1
      evidence:
      - quote: TPP1 encodes the soluble lysosomal enzyme tripeptidyl peptidase-1 (TPP1).
        source_type: publication
        source_name: PubMed abstract (Exp Eye Res 2016)
        source_ref: PMID:27637672
        url: https://pubmed.ncbi.nlm.nih.gov/27637672/
        published_at: '2016-09-13'
        retrieved_at: '2026-10-03'
        method: research:verified-quote
    - gene: HGNC:2076   # CLN5
      evidence:
      - quote: CLN5 is a soluble lysosomal protein with an unclear function in the cell.
        source_type: publication
        source_name: PubMed abstract (Sci Rep 2019)
        source_ref: PMID:30655561
        url: https://pubmed.ncbi.nlm.nih.gov/30655561/
        published_at: '2019-01-17'
        retrieved_at: '2026-10-03'
        method: research:verified-quote
    - gene: HGNC:2529   # CTSD
      evidence:
      - quote: Ceroid lipofuscinosis neuronal 5 (CLN5) and cathepsin D (CTSD) are soluble lysosomal enzymes that also localize extracellularly.
        source_type: publication
        source_name: PubMed abstract (Traffic 2024)
        source_ref: PMID:38272448
        url: https://pubmed.ncbi.nlm.nih.gov/38272448/
        published_at: 2024-01
        retrieved_at: '2026-10-03'
        method: research:verified-quote
    - gene: HGNC:2531   # CTSF
      evidence:
      - quote: Some of them such as CLN1 (palmitoyl protein thioesterase 1), CLN2 (tripeptidyl-peptidase 1), CLN5, CLN10 (cathepsin D), and CLN13 (cathepsin F), are lysosomal soluble proteins; others like CLN3, CLN7, and CLN12, have been proposed to be lysosomal transmembrane proteins.
        source_type: publication
        source_name: PubMed abstract (Biochim Biophys Acta 2015, Cell biology of the NCL proteins)
        source_ref: PMID:25962910
        url: https://pubmed.ncbi.nlm.nih.gov/25962910/
        published_at: '2015-05-08'
