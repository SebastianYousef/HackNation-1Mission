mechanisms:
  - id: ATLAS:mech-er-to-golgi-transfer-of-lysosomal-enzymes
    label: ER-to-Golgi transfer of lysosomal enzymes (CLN6-CLN8 EGRESS complex)
    subtype: biological_process
    description: CLN8 and CLN6 form an ER complex that recruits newly made lysosomal enzymes and passes them to the Golgi; losing either leaves lysosomes short of enzymes.
    genes:
      - gene: CLN8
        evidence:
          - quote: "Here, we show that ER-to-Golgi transfer of lysosomal enzymes requires CLN8, an ER-associated membrane protein whose loss of function leads to the lysosomal storage disorder, neuronal ceroid lipofuscinosis 8 (a type of Batten disease)"
            source_type: publication
            source_name: PubMed
            source_ref: PMID:30397314
            url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&rettype=abstract&retmode=text&id=30397314
            published_at: 2018-12
            retrieved_at: 2026-10-03
      - gene: CLN6
        evidence:
          - quote: "Experiments focused on protein interaction and trafficking identified CLN6 as an obligate component of a CLN6-CLN8 complex (herein referred to as EGRESS: ER-to-Golgi relaying of enzymes of the lysosomal system), which recruits lysosomal enzymes at the ER to promote their Golgi transfer."
            source_type: publication
            source_name: PubMed
            source_ref: PMID:32597833
            url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&rettype=abstract&retmode=text&id=32597833
            published_at: 2020-08-03
            retrieved_at: 2026-10-03
    diseases:
      - disease: MONDO:0010830               # CLN8 disease
        evidence:
          - quote: "Our data establish an unanticipated example of an ER receptor serving the biogenesis of an organelle and indicate that impaired transport of lysosomal enzymes underlies Batten disease caused by mutations in CLN8."
            source_type: publication
            source_name: PubMed
            source_ref: PMID:30397314
            url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&rettype=abstract&retmode=text&id=30397314
            published_at: 2018-12
            retrieved_at: 2026-10-03
      - disease: MONDO:0011144               # CLN6 disease
        evidence:
          - quote: "These results identify CLN6 and the EGRESS complex as key players in lysosome biogenesis and shed light on the molecular etiology of Batten disease caused by defects in CLN6."
            source_type: publication
            source_name: PubMed
            source_ref: PMID:32597833
            url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&rettype=abstract&retmode=text&id=32597833
            published_at: 2020-08-03
            retrieved_at: 2026-10-03
  - id: ATLAS:mech-subunit-c-storage
    label: lysosomal storage of mitochondrial ATP synthase subunit c
    subtype: biological_process
    description: In several NCLs the main stored protein is subunit c of mitochondrial ATP synthase, which fails to be degraded and builds up in lysosomes.
    diseases:
      - disease: MONDO:0009745               # CLN5 disease (variant late infantile NCL)
        evidence:
          - quote: "The present analyses indicate that subunit c of the mitochondrial ATP synthase is the major protein in vLINCL brain storage cytosomes."
            source_type: publication
            source_name: PubMed
            source_ref: PMID:9100667
            url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&rettype=abstract&retmode=text&id=9100667
            published_at: 1997-04
            retrieved_at: 2026-10-03
          - quote: "The CLN5Y392X iPSC-derived neural lineage cells showed accumulation of autofluorescent storage material and subunit C of the mitochondrial ATP synthase, both representing the hallmarks of many forms of NCLs, including CLN5 disease."
            source_type: publication
            source_name: PubMed
            source_ref: PMID:28468312
            url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&rettype=abstract&retmode=text&id=28468312
            published_at: 2017-05-01
            retrieved_at: 2026-10-03
      - disease: MONDO:0008769               # CLN2 disease (classical late infantile NCL)
        evidence:
          - quote: "Thus, despite clinical differences and the fact that various forms of NCL are caused by different genetic defects, variant and classical LINCL as well as juvenile NCL are all characterized by pronounced lysosomal accumulation of the same hydrophobic protein, subunit c of the mitochondrial ATP synthase."
            source_type: publication
            source_name: PubMed
            source_ref: PMID:9100667
            url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&rettype=abstract&retmode=text&id=9100667
            published_at: 1997-04
            retrieved_at: 2026-10-03
      - disease: MONDO:0019262               # juvenile NCL
        evidence:
          - quote: "Thus, despite clinical differences and the fact that various forms of NCL are caused by different genetic defects, variant and classical LINCL as well as juvenile NCL are all characterized by pronounced lysosomal accumulation of the same hydrophobic protein, subunit c of the mitochondrial ATP synthase."
            source_type: publication
            source_name: PubMed
            source_ref: PMID:9100667
            url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&rettype=abstract&retmode=text&id=9100667
            published_at: 1997-04
            retrieved_at: 2026-10-03
          - quote: "Direct sequencing of storage bodies isolated from tissues of children with juvenile and late infantile ceroid-lipofuscinosis established that they also contain large amounts of complete and normal subunit c."
            source_type: publication
            source_name: PubMed
            source_ref: PMID:1535179
            url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&rettype=abstract&retmode=text&id=1535179
            published_at: 1992-02-15
            retrieved_at: 2026-10-03
  - id: ATLAS:mech-lysosomal-bmp-synthesis
    label: lysosomal bis(monoacylglycero)phosphate (BMP) synthesis
    subtype: biological_process
    description: BMP is a lysosomal lipid needed for lipid breakdown; CLN5 is the enzyme that makes it, and CLN3 loss lowers its synthesis.
    genes:
      - gene: CLN5
        evidence:
          - quote: "Here, we report that the Batten disease gene product CLN5 is the elusive BMP synthase (BMPS)."
            source_type: publication
            source_name: PubMed
            source_ref: PMID:37708259
            url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&rettype=abstract&retmode=text&id=37708259
            published_at: 2023-09-15
            retrieved_at: 2026-10-03
      - gene: CLN3
        evidence:
          - quote: "These data illustrate a new finding, a strong correlation between CLN3 protein expression and synthesis of bis(monoacylglycerol)phosphate."
            source_type: publication
            source_name: PubMed
            source_ref: PMID:17482562
            url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&rettype=abstract&retmode=text&id=17482562
            published_at: 2007-06-22
            retrieved_at: 2026-10-03
    diseases:
      - disease: MONDO:0008767               # CLN3 disease
        evidence:
          - quote: "Metabolic labeling of JNCL-fibroblasts demonstrated a reduction in the synthesis of bis(monoacylglycerol)phosphate which was restored following complementation with wild-type-CLN3, substantiating our initial observation in brain."
            source_type: publication
            source_name: PubMed
            source_ref: PMID:17482562
            url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&rettype=abstract&retmode=text&id=17482562
            published_at: 2007-06-22
            retrieved_at: 2026-10-03


