    label: Batten Disease Support and Research Association (BDSRA)
    subtype: patient_group
    website: https://bdsrafoundation.org     # bdsra.org redirects here
    country: US
    has_registry: null
    serves:
      - disease: MONDO:0016295               # neuronal ceroid lipofuscinosis (Batten disease)
        evidence:
          - quote: "Founded in 1987, by parents seeking to build a network for those diagnosed with Batten disease, BDSRA is now the largest support and research organization dedicated to Batten disease in North America."
            source_type: patient_org_site
            source_name: BDSRA
            url: https://bdsrafoundation.org/
            retrieved_at: 2026-10-03
  - id: ORG:bdfa-uk
