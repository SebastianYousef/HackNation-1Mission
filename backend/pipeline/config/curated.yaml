  - id: ATLAS:mech-lysosomal-bmp-synthesis
    label: lysosomal bis(monoacylglycero)phosphate (BMP) synthesis
    subtype: biological_process
    description: BMP is a lysosomal lipid needed for lipid breakdown; CLN5 is the enzyme that makes it, and CLN3 loss lowers its synthesis.
    genes:
      - gene: CLN5
        evidence:
          - quote: "Here, we report that the Batten disease gene product CLN5 is the elusive BMP synthase (BMPS)."
            source_type: publication
            source_name: PubMed
            source_ref: PMID:37708259
            url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&rettype=abstract&retmode=text&id=37708259
            published_at: 2023-09-15
            retrieved_at: 2026-10-03
      - gene: CLN3
        evidence:
          - quote: "These data illustrate a new finding, a strong correlation between CLN3 protein expression and synthesis of bis(monoacylglycerol)phosphate."
            source_type: publication
            source_name: PubMed
            source_ref: PMID:17482562
            url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&rettype=abstract&retmode=text&id=17482562
            published_at: 2007-06-22
            retrieved_at: 2026-10-03
    diseases:
      - disease: MONDO:0008767               # CLN3 disease
        evidence:
          - quote: "Metabolic labeling of JNCL-fibroblasts demonstrated a reduction in the synthesis of bis(monoacylglycerol)phosphate which was restored following complementation with wild-type-CLN3, substantiating our initial observation in brain."
            source_type: publication
