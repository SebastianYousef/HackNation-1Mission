# Hand-curated facts that no open database exposes in machine-readable form.
# Loaded by atlas_pipeline/ingest/curated.py (stage "curated"). Read the schema before adding facts.
#
# ── Status rule (CLAUDE.md rule 2) ──────────────────────────────────────────────────────────────
#   * An edge is `literature` when at least one of its supporting evidence entries carries a verbatim
#     `quote` copied from the source page (publication, regulator, organisation website, …).
#   * An edge without any quote is loaded as `hypothesis` (confidence capped at 0.4, hidden from the
#     mechanism views) and logged as a warning. We keep it visible rather than drop it, but the UI
#     labels it as unconfirmed. Add a quote to promote it.
#   * Nothing in this file is ever `curated`: that status is reserved for curated databases
#     (MONDO, HPO, Orphanet, ClinVar, Reactome …) ingested by their own stages.
#   * An edge entry without an `evidence` list is skipped (every edge needs >= 1 evidence row).
#
# ── Quotes ─────────────────────────────────────────────────────────────────────────────────────
#   A quote must be an exact substring of the page text at `url` after stripping HTML tags and
#   collapsing whitespace (curly quotes, dashes and accents kept as on the page). Keep it short
#   (one or two sentences) and make sure it actually states the edge. Never paraphrase, never
#   translate (a German page gets a German quote). If the live page is gone, quote an archived copy
#   (web.archive.org) and put the archive link in `url`, the original link in `source_ref`.
#   `python -m atlas_pipeline.ingest.curated --verify` re-fetches every url and checks every quote.
#
# ── Evidence entry (the `evidence:` list under every edge) ─────────────────────────────────────
#   - quote:        "verbatim sentence"            # or null (-> edge is `hypothesis`)
#     source_type:  publication | patient_org_site | web | database | trial_registry | grant_database
#                   (contract SourceType; `computed` is not allowed here). A regulator press release
#                   or org news page is `web`, the org's own site is `patient_org_site`, a paper is
#                   `publication`, a drug-label database page (DailyMed) is `database`.
#     source_name:  "FDA" | "PubMed" | "BDSRA" | …  (required; shown in the edge drawer)
#     source_ref:   "PMID:28976277" | "NCT01234567" | original URL   (default: url)
#     url:          https://…   (a link a human can open and find the quote on)
#     published_at: 2017-04-27 | 2017-04 | 2017 | null
#     retrieved_at: 2026-10-03   (when the quote was checked against the page)
#     stance:       supports (default) | contradicts | context
#     method:       manual (default) | any short provenance tag, e.g. "research:verified-quote"
#
# ── References ─────────────────────────────────────────────────────────────────────────────────
#   disease: MONDO id, or any xref MONDO maps (OMIM:/ORPHA:/…). Must be in the slice, else skipped.
#   gene:    HGNC id (HGNC:2073) or approved symbol (TPP1), mapped through the HGNC table.
#            Genes outside the slice get a gene node from HGNC (logged).
#   mechanism (under interventions.targets): an ATLAS:mech-* id defined below, or a REACT:* id.
#   organization (under assets.owner): an ORG:* id, normally defined below.
#
# ── Sections ───────────────────────────────────────────────────────────────────────────────────
# organizations:                      -> node type organization
#   - id: ORG:<slug>                  # optional, default ORG:<slug(label)>
#     label, subtype                  # subtype: patient_group|foundation|company|funder|investor|academic|hospital
#     website, country, contact_url, has_registry (true|false|null), description
#     serves:                         -> organization_serves_disease
#       - disease: <ref>
#         evidence: [<evidence entry>, …]
#
# mechanisms:                         -> node type mechanism
#   - id: ATLAS:mech-<slug>           # optional, default ATLAS:mech-<slug(label)>
#     label, description
#     subtype: biological_process | pathway
#     genes:                          -> gene_in_mechanism
#       - gene: <ref>
#         evidence: [...]
#     diseases:                       -> disease_involves_mechanism
#       - disease: <ref>
#         evidence: [...]
#
# assets:                             -> node type asset  (attrs: asset_kind = subtype, access, owner_id)
#   - id: ASSET:<slug>                # optional, default ASSET:<slug(label)>
#     label, description, url
#     subtype: registry | natural_history_study | animal_model | cell_model | biomarker | biobank
#     access: open | on_request | restricted | null
#     owner:                          -> organization_maintains_asset (owner.id becomes attrs.owner_id)
#       id: ORG:<slug>
#       evidence: [...]
#     covers:                         -> asset_covers_disease
#       - disease: <ref>
#         evidence: [...]
#     targets:                        -> asset_targets_gene
#       - gene: <ref>
#         evidence: [...]
#
# interventions:                      -> node type intervention
#   - id: ATLAS:int-<slug>            # optional, default ATLAS:int-<slug(label)>
#     label, description, synonyms: [...]
#     subtype: small_molecule | enzyme_replacement | gene_therapy | antisense_oligonucleotide | other
#     treats:                         -> intervention_treats_disease (attrs.approval)
#       - disease: <ref>
#         approval: approved | investigational
#         evidence: [...]
#     targets:                        -> intervention_targets_mechanism
#       - mechanism: <ATLAS:mech-* | REACT:*>
#         evidence: [...]

