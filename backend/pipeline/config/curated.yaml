    subtype: registry
    access: on_request
    url: https://clinicaltrials.gov/study/NCT04613089
    description: International natural-history registry for all NCL forms (NCT04613089), with longitudinal clinical ratings and a virtual biorepository; run from the Hamburg NCL Specialty Clinic.
    owner:
      id: ORG:uke-hamburg
      evidence:
      - quote: The DEM-CHILD database, an NCL disease registry, was founded in Hamburg as part of the EU-funded FP7 project DEM-CHILD
        source_type: publication
        source_name: PubMed Central
        source_ref: PMID:35211079
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8861081/
        published_at: '2022-02-08'
        retrieved_at: '2026-10-03'
      - quote: Die historischen Vergleichsdaten wurden zuvor im Rahmen des im UKE von Dr. Schulz koordinierten europäischen Forschungsrahmenprogramms (FP7) DEM-CHILD gesammelt und ausgewertet.
        source_type: web
        source_name: idw - Informationsdienst Wissenschaft (UKE press release)
        url: https://idw-online.de/en/news693186
        published_at: '2018-04-25'
        retrieved_at: '2026-10-03'
        method: research:verified-quote
    covers:
    - disease: MONDO:0016295   # neuronal ceroid lipofuscinosis
      evidence:
      - quote: Natural History and Long Term Clinical Assessments of All Forms of Neuronal Ceroid Lipofuscinoses - Capturing Key Symptoms and Disease Progression as Part of the Independent, International NCL DEM-CHILD Patient Database
        source_type: trial_registry
        source_name: ClinicalTrials.gov
        source_ref: NCT04613089
        url: https://clinicaltrials.gov/api/v2/studies/NCT04613089
        retrieved_at: '2026-10-03'
      - quote: Among 41 patients for whom longitudinal assessments spanning an extended disease course were available within the DEM-CHILD DB (an international NCL disease patient database, NCT04613089), a rapid loss of motor and language abilities was documented in quantitative detail.
        source_type: publication
        source_name: PubMed
        source_ref: PMID:35211079
        url: https://pubmed.ncbi.nlm.nih.gov/35211079/
        published_at: '2022-02-08'
        retrieved_at: '2026-10-03'
        method: research:verified-quote
      - quote: DEM-CHILD will collect the world’s largest, clinically and genetically best characterised set of NCL patients in order to study disease prevalence and precisely describe the natural history of the NCLs leading to the development of an evaluation tool for experimental therapy studies.
        source_type: database
        source_name: CORDIS (European Commission) DEM-CHILD project fact sheet
        url: https://cordis.europa.eu/project/id/281234
        retrieved_at: '2026-10-03'
        method: research:verified-quote
    - disease: MONDO:0008769   # neuronal ceroid lipofuscinosis 2
      evidence:
      - quote: 'We did an observational cohort study using data from two independent, international datasets of patients with untreated genotypically confirmed CLN2 disease: the DEM-CHILD dataset (n=74) and the Weill Cornell Medical College (WCMC) dataset (n=66).'
        source_type: publication
        source_name: PubMed
        source_ref: PMID:30119717
        url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&rettype=abstract&retmode=text&id=30119717
        published_at: 2018-08
        retrieved_at: '2026-10-03'
      - quote: These data were accepted by EMA and FDA as valid natural-history controls for the evaluation of efficacy in experimental therapies for CLN2 disease and led to an expedited approval of intracerebroventricular enzyme replacement therapy with cerliponase alpha in May 2017.
