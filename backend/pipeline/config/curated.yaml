mechanisms: []

assets: []

interventions:
  - id: ATLAS:int-cerliponase-alfa
    label: cerliponase alfa (Brineura)
    subtype: enzyme_replacement
    synonyms: [Brineura]
    treats:
      - disease: OMIM:204500                 # CLN2 disease
        approval: approved
        evidence:
          - quote: "Brineura is the first FDA-approved treatment to slow loss of walking ability (ambulation) in symptomatic pediatric patients 3 years of age and older with late infantile neuronal ceroid lipofuscinosis type 2 (CLN2), also known as tripeptidyl peptidase-1 (TPP1) deficiency."
            source_type: web
            source_name: FDA
            # the live press release now 404s; the quote is checked against the archived copy
            source_ref: https://www.fda.gov/news-events/press-announcements/fda-approves-first-treatment-form-batten-disease
            url: https://web.archive.org/web/20240118204124/https://www.fda.gov/news-events/press-announcements/fda-approves-first-treatment-form-batten-disease
            published_at: 2017-04-27
            retrieved_at: 2026-10-03
          - quote: "BRINEURA is indicated to slow the loss of ambulation in pediatric patients with neuronal ceroid lipofuscinosis type 2 (CLN2 disease), also known as tripeptidyl peptidase 1 (TPP1) deficiency."
            source_type: database
            source_name: DailyMed (FDA label)
            url: https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=485ab3c5-0359-4878-872f-2fe1e7df4047
            published_at: 2024-07
            retrieved_at: 2026-10-03
