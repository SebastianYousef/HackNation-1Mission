  - id: ATLAS:mech-er-to-golgi-transfer-of-lysosomal-enzymes
    label: ER-to-Golgi transfer of lysosomal enzymes (CLN6-CLN8 EGRESS complex)
    subtype: biological_process
    description: CLN8 and CLN6 form an ER complex that recruits newly made lysosomal enzymes and passes them to the Golgi; losing either leaves lysosomes short of enzymes.
    genes:
    - gene: CLN8
      evidence:
      - quote: Here, we show that ER-to-Golgi transfer of lysosomal enzymes requires CLN8, an ER-associated membrane protein whose loss of function leads to the lysosomal storage disorder, neuronal ceroid lipofuscinosis 8 (a type of Batten disease)
        source_type: publication
        source_name: PubMed
        source_ref: PMID:30397314
        url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&rettype=abstract&retmode=text&id=30397314
        published_at: 2018-12
        retrieved_at: '2026-10-03'
    - gene: CLN6
      evidence:
      - quote: 'Experiments focused on protein interaction and trafficking identified CLN6 as an obligate component of a CLN6-CLN8 complex (herein referred to as EGRESS: ER-to-Golgi relaying of enzymes of the lysosomal system), which recruits lysosomal enzymes at the ER to promote their Golgi transfer.'
        source_type: publication
        source_name: PubMed
        source_ref: PMID:32597833
        url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&rettype=abstract&retmode=text&id=32597833
        published_at: '2020-08-03'
        retrieved_at: '2026-10-03'
    - gene: HGNC:2076   # CLN5
      evidence:
      - quote: The accumulated CLN5 disrupts the interaction between CLN6/8 and lysosomal enzymes at the endoplasmic reticulum (ER), subsequently impairing ER-to-Golgi trafficking of lysosomal enzymes.
        source_type: publication
        source_name: Wang et al. 2022, Sci Adv
        source_ref: PMID:35921411
        url: https://pubmed.ncbi.nlm.nih.gov/35921411/
        published_at: '2022-08-03'
        retrieved_at: '2026-10-03'
        method: research:verified-quote
    diseases:
    - disease: MONDO:0010830   # neuronal ceroid lipofuscinosis 8
      evidence:
      - quote: Our data establish an unanticipated example of an ER receptor serving the biogenesis of an organelle and indicate that impaired transport of lysosomal enzymes underlies Batten disease caused by mutations in CLN8.
        source_type: publication
        source_name: PubMed
        source_ref: PMID:30397314
        url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&rettype=abstract&retmode=text&id=30397314
        published_at: 2018-12
        retrieved_at: '2026-10-03'
    - disease: MONDO:0011144   # ceroid lipofuscinosis, neuronal, 6A
      evidence:
