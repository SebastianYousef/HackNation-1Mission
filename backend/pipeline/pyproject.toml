[project]
name = "atlas-pipeline"
version = "0.1.0"
description = "Offline data pipeline for the Rare Disease Atlas (ingest -> extract -> reconcile -> analytics -> views -> load)"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pyyaml>=6",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pandas>=2.2",
  "pyarrow>=16",
  "numpy>=1.26",
  "scipy>=1.13",
  "networkx>=3.3",
  "psycopg[binary]>=3.2",
  "openai>=1.60",
]

[project.optional-dependencies]
graph = ["python-igraph>=0.11", "leidenalg>=0.10"]
scrape = ["playwright>=1.47"]   # Bright Data Scraping Browser (connects over CDP; no local browser download)
dev = ["pytest>=8"]

[project.scripts]
atlas-pipeline = "atlas_pipeline.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atlas_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
