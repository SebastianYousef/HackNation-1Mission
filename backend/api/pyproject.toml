[project]
name = "atlas-api"
version = "1.0.0"
description = "Rare Disease Atlas REST API (contract/atlas.ts v1)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.3",
  "psycopg[binary,pool]>=3.2",
  "redis>=5.0",
  "openai>=1.60",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atlas_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
